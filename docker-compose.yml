services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - PORT=3000
    volumes:
      - ont_db:/app/backend/database
      - ont_uploads:/app/uploads

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${PUERTO_BIENES:-3004}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  ont_db:
  ont_uploads:
