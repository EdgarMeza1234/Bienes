services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - PORT=3000
    volumes:
      - ont_db:/app/backend/database
      - ont_uploads:/app/uploads

  web:
    build:
      context: .
      dockerfile: web.Dockerfile
    restart: unless-stopped
    ports:
      - "${PUERTO_BIENES:-3004}:80"
    depends_on:
      - app

volumes:
  ont_db:
  ont_uploads:
